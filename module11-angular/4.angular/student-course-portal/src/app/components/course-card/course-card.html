<div
  class="course-card"
  appHighlight="lightblue"

  [ngClass]="cardClasses"

  [ngStyle]="{
    'border-left':
      course.gradeStatus === 'passed'
        ? '6px solid green'
        : course.gradeStatus === 'failed'
        ? '6px solid red'
        : '6px solid gray'
  }">

  <h3>{{ course.name }}</h3>

  <p><b>Code:</b> {{ course.code }}</p>

  <p><b>Credits:</b> {{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">

    <span *ngSwitchCase="'passed'" style="color:green">
      ✅ Passed
    </span>

    <span *ngSwitchCase="'failed'" style="color:red">
      ❌ Failed
    </span>

    <span *ngSwitchCase="'pending'" style="color:gray">
      ⏳ Pending
    </span>

  </div>

  <br>

  <button (click)="enroll()">
    Enroll
  </button>

  <button (click)="toggleDetails()">
    Show Details
  </button>

  <div *ngIf="isExpanded">
    <hr>
    <p><b>Course ID:</b> {{ course.id }}</p>
    <p>This is a sample course description.</p>
  </div>

</div>
