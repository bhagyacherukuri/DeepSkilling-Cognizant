<h1>{{ portalName }}</h1>
<app-course-summary-widget></app-course-summary-widget>
<h3>Total Courses: {{ courseCount }}</h3>
<p>Manage your courses, enrollment, and profile from one place.</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>
<button (click)="addNewCourse()">Add React Course</button>
<app-notification></app-notification>
<p>{{ message }}</p>

<br><br>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search Course">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<h2>Available Courses</h2>

<div class="course-container">

  <app-course-card
    *ngFor="let course of courses"
    [course]="course"
    (enrollRequested)="onEnroll($event)">
  </app-course-card>

</div>

<p *ngIf="selectedCourseId">
  Selected Course ID: {{ selectedCourseId }}
</p>
