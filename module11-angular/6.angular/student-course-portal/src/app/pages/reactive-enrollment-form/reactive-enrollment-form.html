<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <!-- Student Name -->

  <label>Student Name</label>

  <input
    type="text"
    formControlName="studentName">

  <div
    *ngIf="enrollForm.get('studentName')?.touched &&
           enrollForm.get('studentName')?.invalid">

    <span *ngIf="enrollForm.get('studentName')?.errors?.['required']">
      Name is required
    </span>

    <span *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">
      Minimum 3 characters
    </span>

  </div>

  <br><br>

  <!-- Email -->

  <label>Email</label>

  <input
    type="email"
    formControlName="studentEmail">

  <div *ngIf="enrollForm.get('studentEmail')?.touched">

  <span *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">
    Email is required.
  </span>

  <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">
    Please enter a valid email address.
  </span>

  <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
    Email already taken.
  </span>

</div>

  <br><br>

  <!-- Course -->

  <label>Course ID</label>

  <input
    type="text"
    formControlName="courseId">
<div *ngIf="enrollForm.get('courseId')?.touched">

  <span *ngIf="enrollForm.get('courseId')?.hasError('required')">
    Course ID is required.
  </span>

  <span *ngIf="enrollForm.get('courseId')?.hasError('noCourseCode')">
    Course code starting with XX is not allowed.
  </span>

</div>

  <br><br>

  <!-- Semester -->

  <label>Semester</label>

  <select formControlName="preferredSemester">

    <option value="Odd">Odd</option>

    <option value="Even">Even</option>

  </select>

  <br><br>

  <!-- Terms -->

  <label>

    <input
      type="checkbox"
      formControlName="agreeToTerms">

    Agree to Terms

  </label>

  <div
    *ngIf="enrollForm.get('agreeToTerms')?.touched &&
           enrollForm.get('agreeToTerms')?.invalid">

    Please accept terms

  </div>

  <br><br>

  <!-- Additional Courses -->

  <h3>Additional Courses</h3>

  <button
    type="button"
    (click)="addCourse()">

    Add Another Course

  </button>

  <br><br>

  <div
    *ngFor="let ctrl of additionalCourses.controls; let i = index">

    <input
      [formControl]="ctrl">

    <button
      type="button"
      (click)="removeCourse(i)">

      Remove

    </button>

  </div>

  <br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit


  </button>
