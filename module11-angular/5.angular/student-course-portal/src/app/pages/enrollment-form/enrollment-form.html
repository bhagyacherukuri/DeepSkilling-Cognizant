<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <!-- Student Name -->
  <label>Student Name</label><br>
  <input
    type="text"
    name="studentName"
    [(ngModel)]="studentName"
    required
    minlength="3"
    #nameCtrl="ngModel">

  <div *ngIf="nameCtrl.touched">
    <small *ngIf="nameCtrl.errors?.['required']">
      Name is required
    </small>

    <small *ngIf="nameCtrl.errors?.['minlength']">
      Name must be at least 3 characters
    </small>
  </div>

  <br><br>

  <!-- Email -->
  <label>Email</label><br>

  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="studentEmail"
    required
    email
    #emailCtrl="ngModel">

  <div *ngIf="emailCtrl.touched">
    <small *ngIf="emailCtrl.errors?.['required']">
      Email is required
    </small>

    <small *ngIf="emailCtrl.errors?.['email']">
      Invalid Email
    </small>
  </div>

  <br><br>

  <!-- Course ID -->
  <label>Course ID</label><br>

  <input
    type="number"
    name="courseId"
    [(ngModel)]="courseId"
    required
    #courseCtrl="ngModel">

  <div *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
    <small>Course ID is required</small>
  </div>

  <br><br>

  <!-- Semester -->
  <label>Preferred Semester</label><br>

  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester"
    required
    #semesterCtrl="ngModel">

    <option value="">Select Semester</option>
    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <div *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">
    <small>Please select a semester</small>
  </div>

  <br><br>

  <!-- Terms -->
  <label>
    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      required
      #termsCtrl="ngModel">

    I agree to the Terms and Conditions
  </label>

  <div *ngIf="termsCtrl.touched && !agreeToTerms">
    <small>Please accept the terms.</small>
  </div>

  <br><br>

  <!-- Buttons -->
  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button
    type="button"
    (click)="enrollForm.resetForm(); submitted=false">
    Reset
  </button>

</form>

<br>

<div *ngIf="submitted">
  <h3 style="color:green;">
    Enrollment request submitted successfully!
  </h3>
</div>
